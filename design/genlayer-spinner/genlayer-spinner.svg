<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48" role="img" aria-label="Loading">
  <title>Loading</title>
  <style>
    :root {
      --mark: #070707;   /* Carbon Void */
      --arc: #110fff;    /* Kinetic Cobalt */
    }
    @media (prefers-color-scheme: dark) {
      :root { --mark: #f5f5f5; } /* Ceramic Node */
    }
    .mark {
      fill: var(--mark);
      transform-box: fill-box;
      transform-origin: center;
      animation: breathe 1.8s ease-in-out infinite;
    }
    .arc {
      fill: none;
      stroke: var(--arc);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-dasharray: 60 170;
      transform-box: fill-box;
      transform-origin: center;
      animation: sweep 1.8s linear infinite;
    }
    @keyframes sweep  { to { transform: rotate(360deg); } }
    @keyframes breathe {
      0%, 100% { opacity: 1;    transform: scale(1); }
      50%      { opacity: 0.82; transform: scale(0.95); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mark { animation: fade 2.2s ease-in-out infinite; }
      .arc  { animation: none; stroke-dasharray: none; opacity: 0.5; }
      @keyframes fade { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    }
  </style>
  <circle class="arc" cx="50" cy="50" r="46" />
  <path class="mark" d="M46.3,27.3 L24,70.7 L47.5,62 L44.4,44.7 Z M53.7,27.3 L76,70.7 L52.5,62 L55.6,44.7 Z M50,54.6 L46.9,63.3 L53.1,63.3 Z" />
</svg>
